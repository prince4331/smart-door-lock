
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600">
  <style>
    .state { fill:#E8F5E9; stroke:#000; stroke-width:1.5; rx:12; ry:12; }
    .terminal { fill:#FFF3E0; stroke:#000; stroke-width:1.5; rx:12; ry:12; }
    .arrow { stroke:#000; stroke-width:1.5; marker-end:url(#arrowhead); }
    text { font-family: Arial, sans-serif; font-size:14px; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">
    Keypad Authentication State Diagram
  </text>

  <!-- States -->
  <rect class="state" x="70" y="80" width="160" height="60"/>
  <text x="150" y="115" text-anchor="middle">IDLE</text>

  <rect class="state" x="300" y="80" width="160" height="60"/>
  <text x="380" y="115" text-anchor="middle">PIN_ENTRY</text>

  <rect class="state" x="530" y="80" width="160" height="60"/>
  <text x="610" y="115" text-anchor="middle">VALIDATE</text>

  <rect class="terminal" x="250" y="220" width="180" height="60"/>
  <text x="340" y="255" text-anchor="middle">ACCESS_GRANTED</text>

  <rect class="terminal" x="480" y="220" width="180" height="60"/>
  <text x="570" y="255" text-anchor="middle">ACCESS_DENIED</text>

  <rect class="terminal" x="350" y="360" width="180" height="60"/>
  <text x="440" y="395" text-anchor="middle">LOCKOUT</text>

  <!-- Transitions -->
  <line class="arrow" x1="230" y1="110" x2="300" y2="110"/>
  <text x="265" y="95" text-anchor="middle">Key press</text>

  <line class="arrow" x1="460" y1="110" x2="530" y2="110"/>
  <text x="495" y="95" text-anchor="middle">#</text>

  <line class="arrow" x1="580" y1="140" x2="400" y2="220"/>
  <text x="510" y="180" text-anchor="middle">Correct PIN</text>

  <line class="arrow" x1="630" y1="140" x2="570" y2="220"/>
  <text x="645" y="185" text-anchor="middle">Wrong PIN</text>

  <line class="arrow" x1="570" y1="280" x2="440" y2="360"/>
  <text x="535" y="330" text-anchor="middle">3 failures</text>

</svg>
