
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1400">
  <style>
    .box { fill:#E3F2FD; stroke:#000; stroke-width:1.5; rx:10; ry:10; }
    .decision { fill:#FFF3E0; stroke:#000; stroke-width:1.5; }
    .arrow { stroke:#000; stroke-width:1.5; marker-end:url(#arrowhead); }
    text { font-family: Arial, sans-serif; font-size:14px; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>

  <text x="550" y="30" text-anchor="middle" font-size="22" font-weight="bold">
    Smart Door Lock & Surveillance System ? Full System Flowchart
  </text>

  <!-- Boot -->
  <rect class="box" x="400" y="60" width="300" height="60"/>
  <text x="550" y="95" text-anchor="middle">System Boot (ESP32)</text>

  <line class="arrow" x1="550" y1="120" x2="550" y2="160"/>

  <!-- Init -->
  <rect class="box" x="350" y="160" width="400" height="80"/>
  <text x="550" y="190" text-anchor="middle">Init NVS, GPIO, Servo, Keypad</text>
  <text x="550" y="210" text-anchor="middle">Load Saved State</text>

  <line class="arrow" x1="550" y1="240" x2="550" y2="280"/>

  <!-- WiFi -->
  <rect class="box" x="400" y="280" width="300" height="60"/>
  <text x="550" y="315" text-anchor="middle">Connect WiFi</text>

  <line class="arrow" x1="550" y1="340" x2="550" y2="380"/>

  <!-- MQTT -->
  <rect class="box" x="350" y="380" width="400" height="80"/>
  <text x="550" y="410" text-anchor="middle">Time Sync (SNTP)</text>
  <text x="550" y="430" text-anchor="middle">MQTT Connect</text>

  <line class="arrow" x1="550" y1="460" x2="550" y2="500"/>

  <!-- Tasks -->
  <rect class="box" x="300" y="500" width="500" height="80"/>
  <text x="550" y="530" text-anchor="middle">Start FreeRTOS Tasks</text>
  <text x="550" y="550" text-anchor="middle">Sensor | Control | Health</text>

  <line class="arrow" x1="550" y1="580" x2="550" y2="630"/>

  <!-- Sensor loop -->
  <rect class="box" x="300" y="630" width="500" height="80"/>
  <text x="550" y="660" text-anchor="middle">Read Sensors (PIR, Reed, Fire)</text>
  <text x="550" y="680" text-anchor="middle">Debounce & State Detection</text>

  <line class="arrow" x1="550" y1="710" x2="550" y2="760"/>

  <!-- Decision -->
  <polygon class="decision" points="550,760 650,820 550,880 450,820"/>
  <text x="550" y="825" text-anchor="middle">Event Detected?</text>

  <!-- No -->
  <line class="arrow" x1="550" y1="880" x2="550" y2="930"/>
  <text x="560" y="905">No</text>
  <line class="arrow" x1="550" y1="930" x2="550" y2="630"/>

  <!-- Yes -->
  <line class="arrow" x1="650" y1="820" x2="850" y2="820"/>
  <text x="720" y="800">Yes</text>

  <!-- Mode -->
  <rect class="box" x="850" y="780" width="220" height="80"/>
  <text x="960" y="810" text-anchor="middle">Check Security Mode</text>
  <text x="960" y="830" text-anchor="middle">HOME / AWAY / NIGHT</text>

  <line class="arrow" x1="960" y1="860" x2="960" y2="920"/>

  <!-- Action -->
  <rect class="box" x="800" y="920" width="320" height="100"/>
  <text x="960" y="950" text-anchor="middle">Trigger Actions</text>
  <text x="960" y="970" text-anchor="middle">Alarm / Unlock / Camera</text>
  <text x="960" y="990" text-anchor="middle">Publish MQTT Event</text>

  <line class="arrow" x1="960" y1="1020" x2="960" y2="1080"/>

  <!-- Cloud -->
  <rect class="box" x="750" y="1080" width="420" height="100"/>
  <text x="960" y="1110" text-anchor="middle">Backend Server (Render)</text>
  <text x="960" y="1130" text-anchor="middle">Process Event & Image</text>
  <text x="960" y="1150" text-anchor="middle">Send Telegram & Update Dashboard</text>

  <!-- End -->
  <text x="960" y="1210" text-anchor="middle">System Continues Monitoring</text>

</svg>
