services:
  - type: web
    name: smartlock-server
    env: node
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MQTT_BROKER
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: DASH_TOKEN
        sync: false
      - key: CAM_UPLOAD_TOKEN
        sync: false
      - key: RATE_LIMIT_MAX
        value: 20
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
